version: 2

updates:
  # Server npm dependencies
  - package-ecosystem: npm
    directory: /Server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Bundle minor/patch updates into one PR to reduce noise
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
