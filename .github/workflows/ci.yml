name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs that need more ask for it themselves
permissions:
  contents: read

jobs:
  lint:
    name: Server lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Server

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Server tests
    runs-on: ubuntu-latest

    # Throwaway PostgreSQL for the integration tests, same version as docker-compose.yml
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_db_test
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: Server

    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_secret_at_least_32_characters_long
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: ecommerce_db_test
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Also proves that all migrations apply cleanly to an empty database
      - name: Run migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm test

  client-lint:
    name: Client lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Client

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

  client-test:
    name: Client tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Client

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Proves the production bundle still builds
      - name: Build
        run: npm run build

  # Builds the production images and starts them together: proves the Dockerfiles, the Caddy
  # config and the start-up (migrations, health checks) work, not only the code
  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci_docker_secret_at_least_32_characters_long

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # --wait returns once every container is running and the API reports healthy
      - name: Build and start the production stack
        run: docker compose -f docker-compose.prod.yml up --build --detach --wait

      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://localhost:8080
          curl --fail --silent "$base/api/health/ready"
          curl --fail --silent "$base/api/products" | grep -q '"success":true'
          curl --fail --silent "$base/" | grep -q '<div id="root">'
          # Client-side routes get index.html too (SPA fallback)
          curl --fail --silent "$base/products/any-product" | grep -q '<div id="root">'
          curl --fail --silent --head "$base/" | grep -qi '^content-security-policy:'

      - name: Show container logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # Slowest job: only start it when the fast checks are green
    needs: [test, client-test]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Catches the emails, the tests read the verification link through its API
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    # The API itself is configured in e2e/playwright.config.ts (port, database, secrets)
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            Server/package-lock.json
            Client/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix Server
          npm ci --prefix Client
          npm ci --prefix e2e

      - name: Check e2e formatting and types
        working-directory: e2e
        run: |
          npm run format:check
          npm run typecheck

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Playwright starts the API (fresh database + seed) and the client build itself
      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      # Screenshots and traces of failed tests (open with `npx playwright show-report`)
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Builds and scans the images on every run; only pushes to main publish them.
  # Deliberately plain docker commands: this job holds a token that can write packages, so as
  # little third-party code as possible runs here (trivy-action was hijacked in March 2026,
  # CVE-2026-33634). The only action is pinned to a commit, because tags can be moved.
  images:
    name: Build, scan and publish images
    runs-on: ubuntu-latest
    # Only code that passed everything becomes an image
    needs: [lint, test, client-lint, client-test, docker, e2e]

    permissions:
      contents: read
      packages: write

    # Two quick merges must not overwrite "latest" in the wrong order
    concurrency:
      group: images-${{ github.ref }}
      cancel-in-progress: false

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # By digest, which cannot be changed afterwards. Dependabot does not see this line:
      # update it by hand, with a release that is at least two weeks old
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      # Sentry project ecommerce-web (EU). Not a secret: it ends up in the public JS bundle
      SENTRY_DSN_WEB: https://7f131868d5a1c79bf31e4214dd2c8d78@o4512421416730624.ingest.de.sentry.io/4512421452185680

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build images
        run: |
          # Registry names must be lowercase
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecommerce"
          echo "IMAGE_PREFIX=$prefix" >> "$GITHUB_ENV"
          for pair in api:Server web:Client; do
            name="${pair%%:*}"
            context="${pair##*:}"
            # The source label links the package to this repository on GitHub
            docker build --pull \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --build-arg "GIT_SHA=$GITHUB_SHA" \
              --build-arg "VITE_SENTRY_DSN=$SENTRY_DSN_WEB" \
              --tag "$prefix-$name:$GITHUB_SHA" \
              --tag "$prefix-$name:latest" \
              "$context"
          done

      # Runs before the registry login, on read-only archives: the scanner gets no token, no
      # environment and no Docker socket. Only critical holes that have a fix block a release
      - name: Scan images
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          for name in api web; do
            docker save "$IMAGE_PREFIX-$name:$GITHUB_SHA" --output "$RUNNER_TEMP/scan/$name.tar"
            docker run --rm --read-only --tmpfs /tmp --tmpfs /root/.cache \
              --volume "$RUNNER_TEMP/scan:/scan:ro" \
              "$TRIVY_IMAGE" image --no-progress --input "/scan/$name.tar" \
              --severity CRITICAL --ignore-unfixed --exit-code 1
          done

      # Exactly the scanned images. Both SHA tags first, "latest" last: it never points to
      # a release that is only half uploaded
      - name: Publish images
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for tag in "$GITHUB_SHA" latest; do
            for name in api web; do
              docker push "$IMAGE_PREFIX-$name:$tag"
            done
          done

  # Continuous deployment: Render starts exactly the images that were just published.
  # Hooks are secrets (anyone with the URL can deploy). No third-party code runs here.
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    # One deployment at a time, in merge order
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    env:
      HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Deploy and verify
        run: |
          if [ -z "$HOOK_API" ] || [ -z "$HOOK_WEB" ] || [ -z "$PRODUCTION_URL" ]; then
            echo "::notice::Deployment is not configured yet, skipping."
            exit 0
          fi

          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecommerce"

          deploy() { # hook, image
            curl --fail --silent --show-error --get \
              --data-urlencode "imgURL=$2:$GITHUB_SHA" "$1" > /dev/null
          }

          # A sleeping free service needs about a minute to wake up, a deploy a few more
          wait_for() { # url, expected text
            for _ in $(seq 1 40); do
              if curl --silent --max-time 20 "$1" | grep -q "$2"; then return 0; fi
              sleep 15
            done
            echo "::error::$1 did not answer with $2"
            return 1
          }

          # API first: it runs the migrations, and the old web works with the new API
          deploy "$HOOK_API" "$prefix-api"
          wait_for "$PRODUCTION_URL/api/health" "\"version\":\"$GITHUB_SHA\""

          deploy "$HOOK_WEB" "$prefix-web"
          wait_for "$PRODUCTION_URL/version.txt" "$GITHUB_SHA"

          wait_for "$PRODUCTION_URL/api/health/ready" '"database":"ok"'
