# Local development services. Start with: docker compose up -d
services:
  db:
    image: postgres:18-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-ecommerce_db}
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ images store data under /var/lib/postgresql/<version>
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
