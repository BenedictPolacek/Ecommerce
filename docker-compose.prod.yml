# Production-like stack: the same images as in production, built locally.
#   1. copy .env.example to .env and set JWT_SECRET
#   2. docker compose -f docker-compose.prod.yml up --build -d   → http://localhost:8080
# Separate from docker-compose.yml (dev services): own project name, own database volume.
name: ecommerce-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ecommerce_db
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: only the API reaches the database (internal network)

  # Catches all mails of this stack: http://localhost:8026 (8025 belongs to the dev Mailpit)
  mail:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8026:8025"

  api:
    build: ./Server
    image: ecommerce-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ecommerce_db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Caddy is the one proxy in front of the API
      TRUST_PROXY: 1
      SMTP_HOST: mail
      SMTP_PORT: 1025
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    # No ports: reachable only through Caddy (web)

  web:
    build: ./Client
    image: ecommerce-web:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
